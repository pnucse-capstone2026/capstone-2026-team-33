name: Public content policy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  policy:
    name: Public content policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history for the approved README baseline
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce public content allowlist
        run: python3 scripts/check_public_team_contents.py
